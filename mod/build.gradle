plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.147'
}

group = 'de.tekatz.foreverskyblock'
version = '0.2.0'
base.archivesName = 'ForeverSkyblock-1.21.1-NeoForge'

repositories {
    maven { url = 'https://maven.blamejared.com' }
}

dependencies {
    compileOnly 'mezz.jei:jei-1.21.1-common-api:19.64.0.454'
    compileOnly 'mezz.jei:jei-1.21.1-neoforge-api:19.64.0.454'
    localRuntime 'mezz.jei:jei-1.21.1-neoforge:19.64.0.454'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets {
    gameTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

neoForge {
    addModdingDependenciesTo sourceSets.gameTest
    version = '21.1.249'
    runs {
        server {
            server()
            programArgument '--nogui'
        }
        client { client() }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', 'forever_skyblock'
            gameDirectory = project.file('runs/gametest')
        }
    }
    mods {
        forever_skyblock {
            sourceSet sourceSets.main
            if (project.hasProperty('condenserTests')) sourceSet sourceSets.gameTest
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
