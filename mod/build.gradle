plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.147'
}

group = 'de.tekatz.foreverskyblock'
version = '0.18.1'
base.archivesName = 'ForeverSkyblock-1.21.1-NeoForge'

repositories {
    mavenCentral()
    maven { url = 'https://api.modrinth.com/maven'; content { includeGroup 'maven.modrinth' } }
    maven { url = 'https://maven.neoforged.net/releases' }
    maven { url = 'https://cursemaven.com'; content { includeGroup 'curse.maven' } }
    maven { url = 'https://maven.blamejared.com' }
    maven { url = 'https://maven.ftb.dev/releases' }
    maven { url = 'https://maven.architectury.dev' }
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets {
    gameTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

neoForge {
    version = project.findProperty('packRuntime') ?: '21.1.249'
    addModdingDependenciesTo sourceSets.gameTest
    runs {
        server {
            server()
            programArgument '--nogui'
        }
        client { client() }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', 'forever_skyblock'
            systemProperty 'forever_skyblock.expectAscension', project.hasProperty('ascensionTests').toString()
            systemProperty 'forever_skyblock.expectJetpacks', project.hasProperty('jetpackTests').toString()
            systemProperty 'forever_skyblock.expectToolIntegrations', project.hasProperty('toolIntegrationTests').toString()
            systemProperty 'forever_skyblock.expectTechChallenges', project.hasProperty('techChallengeTests').toString()
            gameDirectory = project.file('runs/gametest')
        }
    }
    mods {
        forever_skyblock {
            sourceSet sourceSets.main
            if (project.hasProperty('condenserTests')) sourceSet sourceSets.gameTest
        }
    }
}

dependencies {
    compileOnly 'curse.maven:iron-jetpacks-284497:7105279'
    gameTestCompileOnly 'curse.maven:iron-jetpacks-284497:7105279'
    gameTestCompileOnly('org.appliedenergistics:appliedenergistics2:19.2.18') { transitive = false }
    if (project.hasProperty('jetpackTests')) {
        runtimeOnly 'curse.maven:iron-jetpacks-284497:7105279'
        runtimeOnly 'curse.maven:cucumber-272335:8035802'
        runtimeOnly 'org.appliedenergistics:appliedenergistics2:19.2.18'
        runtimeOnly 'org.appliedenergistics:guideme:21.1.19'
    }
    if (project.hasProperty('ascensionTests') || project.hasProperty('techChallengeTests')) {
        runtimeOnly('maven.modrinth:mekanism:5KzzycBT') { transitive = false }
        runtimeOnly('maven.modrinth:powah:1prWLuga') { transitive = false }
        runtimeOnly('maven.modrinth:cloth-config:izKINKFg') { transitive = false }
    }
    if (project.hasProperty('techChallengeTests')) {
        runtimeOnly('curse.maven:mystical-agriculture-246640:8796913') { transitive = false }
        runtimeOnly 'curse.maven:cucumber-272335:8035802'
    }
    if (project.hasProperty('toolIntegrationTests')) {
        runtimeOnly('dev.ftb.mods:ftb-ultimine-neoforge:2101.1.15') { transitive = false }
        runtimeOnly('dev.ftb.mods:ftb-library-neoforge:2101.1.37') { transitive = false }
        runtimeOnly('dev.architectury:architectury-neoforge:13.0.11') { transitive = false }
    }
    clientAdditionalRuntimeClasspath 'curse.maven:iron-jetpacks-284497:7105279'
    clientAdditionalRuntimeClasspath 'curse.maven:cucumber-272335:8035802'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testImplementation 'com.google.code.gson:gson:2.10.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    compileOnly 'mezz.jei:jei-1.21.1-common-api:19.64.0.454'
    compileOnly 'mezz.jei:jei-1.21.1-neoforge-api:19.64.0.454'
    clientAdditionalRuntimeClasspath 'mezz.jei:jei-1.21.1-neoforge:19.64.0.454'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging { exceptionFormat = 'full'; events 'passed', 'failed', 'skipped' }
}
