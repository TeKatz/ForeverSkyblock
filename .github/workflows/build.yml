name: Build Forever Skyblock Mod

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

# A feature branch with an open PR should have exactly one active CI run. New
# commits cancel stale work instead of burning runner time on obsolete builds.
concurrency:
  group: forever-skyblock-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-mod:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build mod
        run: ./gradlew build compileGameTestJava --no-daemon
      - name: Smoke-test client mixin application
        shell: bash
        run: |
          set +e
          timeout --signal=TERM --kill-after=10s 90s xvfb-run -a ./gradlew runClient -PapotheosisTests --no-daemon > client-smoke.log 2>&1
          status=$?
          set -e
          cat client-smoke.log
          if grep -Eq 'Mixin apply for mod forever_skyblock failed|Failed to apply mixin.*forever_skyblock|InvalidInjectionException.*forever_skyblock' client-smoke.log; then
            echo 'Forever Skyblock client mixin application failed.' >&2
            exit 1
          fi
          if grep -Eq 'Failed to load model forever_skyblock:|Unable to load model:.*forever_skyblock:|Unable to resolve texture.*forever_skyblock:' client-smoke.log; then
            echo 'Forever Skyblock client model or texture loading failed.' >&2
            exit 1
          fi
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            echo "Client smoke test exited unexpectedly with status $status." >&2
            exit "$status"
          fi
          if ! grep -q 'ModLauncher running' client-smoke.log; then
            echo 'Client smoke test never reached ModLauncher.' >&2
            exit 1
          fi
      - name: Render machine GUI and block fixtures
        shell: bash
        run: |
          timeout --signal=TERM --kill-after=10s 240s xvfb-run -a -s '-screen 0 1920x1080x24' ./gradlew runClient -PcondenserTests -PmachineVisualTests --no-daemon > machine-visual.log 2>&1 || { cat machine-visual.log; exit 1; }
          cat machine-visual.log
          grep -q 'MACHINE_VISUAL_COMPLETE' machine-visual.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Machine-Visual-QA
          path: |
            mod/**/screenshots/machine-*.png
            mod/machine-visual.log
          if-no-files-found: warn
          retention-days: 14
      - name: Render K-menu visual fixtures
        shell: bash
        run: |
          timeout --signal=TERM --kill-after=10s 120s xvfb-run -a -s '-screen 0 1920x1080x24' ./gradlew runClient -PcondenserTests -PmenuVisualTests --no-daemon > menu-visual.log 2>&1 || { cat menu-visual.log; exit 1; }
          cat menu-visual.log
          grep -q 'MENU_VISUAL_COMPLETE' menu-visual.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: K-Menu-Visual-QA
          path: |
            mod/**/screenshots/menu-*.png
            mod/menu-visual.log
          if-no-files-found: warn
          retention-days: 14
      - name: Test dedicated-server regression suite
        run: ./gradlew runGameTestServer -PcondenserTests --no-daemon
      - name: Test full pack-runtime integrations on NeoForge 21.1.264
        run: ./gradlew runGameTestServer -PcondenserTests -PjetpackTests -PtoolIntegrationTests -PascensionTests -PtechChallengeTests -PapotheosisTests -PpackRuntime=21.1.264 --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ForeverSkyblock-Mod
          path: mod/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
