name: Build Forever Skyblock Mod

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-mod:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build mod
        run: ./gradlew build --no-daemon
      - name: Test dedicated-server regression suite
        run: ./gradlew runGameTestServer -PcondenserTests --no-daemon
      - name: Test full pack-runtime integrations on NeoForge 21.1.259
        run: ./gradlew runGameTestServer -PcondenserTests -PjetpackTests -PtoolIntegrationTests -PascensionTests -PtechChallengeTests -PpackRuntime=21.1.259 --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ForeverSkyblock-Mod
          path: mod/build/libs/*.jar
          if-no-files-found: error
