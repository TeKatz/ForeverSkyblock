name: Forever GUI Designer

on:
  pull_request:
    paths:
      - 'tools/ForeverGuiDesigner/**'
      - '.github/workflows/gui-designer.yml'
  push:
    branches:
      - main
    paths:
      - 'tools/ForeverGuiDesigner/**'
      - '.github/workflows/gui-designer.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore .\tools\ForeverGuiDesigner\ForeverGuiDesigner.csproj

      - name: Build
        run: dotnet build .\tools\ForeverGuiDesigner\ForeverGuiDesigner.csproj --configuration Release --no-restore

      - name: Publish portable Windows app
        run: >-
          dotnet publish .\tools\ForeverGuiDesigner\ForeverGuiDesigner.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false
          --output .\artifacts\ForeverGuiDesigner

      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: ForeverGuiDesigner-Windows-x64
          path: .\artifacts\ForeverGuiDesigner\ForeverGuiDesigner.exe
          if-no-files-found: error
          compression-level: 0
