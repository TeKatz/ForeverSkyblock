name: Forever GUI Designer

on:
  pull_request:
    paths:
      - 'tools/ForeverGuiDesigner/**'
      - '.github/workflows/gui-designer.yml'
  push:
    branches:
      - main
      - feature/forever-gui-designer-mvp
    paths:
      - 'tools/ForeverGuiDesigner/**'
      - '.github/workflows/gui-designer.yml'
  workflow_dispatch:

permissions:
  contents: write

# Release publication must be serialized. Canceling a run while it is replacing
# channel assets can leave the fixed release in a mixed-build state.
concurrency:
  group: gui-designer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore .\tools\ForeverGuiDesigner\ForeverGuiDesigner.csproj

      - name: Build
        run: >-
          dotnet build .\tools\ForeverGuiDesigner\ForeverGuiDesigner.csproj
          --configuration Release
          --no-restore
          -p:InformationalVersion=${{ github.sha }}

      - name: Publish portable Windows app
        run: >-
          dotnet publish .\tools\ForeverGuiDesigner\ForeverGuiDesigner.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -p:InformationalVersion=${{ github.sha }}
          --output .\artifacts\ForeverGuiDesigner

      - name: Create update manifest
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $channel = if ($env:GITHUB_REF -eq 'refs/heads/main') { 'stable' } else { 'development' }
          $exe = Resolve-Path '.\artifacts\ForeverGuiDesigner\ForeverGuiDesigner.exe'
          $item = Get-Item $exe
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $immutableAsset = "ForeverGuiDesigner-$env:GITHUB_SHA.exe"
          Copy-Item $exe ".\artifacts\$immutableAsset" -Force
          $manifest = [ordered]@{
            channel = $channel
            commit = $env:GITHUB_SHA
            asset = $immutableAsset
            sha256 = $hash
            size = $item.Length
            builtAt = (Get-Date).ToUniversalTime().ToString('o')
            notes = if ($channel -eq 'development') {
              'Latest development build from feature/forever-gui-designer-mvp.'
            } else {
              'Latest stable build from main.'
            }
          }
          $manifest | ConvertTo-Json | Set-Content '.\artifacts\update-manifest.json' -Encoding UTF8

      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: ForeverGuiDesigner-Windows-x64
          path: .\artifacts\ForeverGuiDesigner\ForeverGuiDesigner.exe
          if-no-files-found: error
          compression-level: 0

      - name: Publish self-update channel
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $channel = if ($env:GITHUB_REF -eq 'refs/heads/main') { 'stable' } else { 'development' }
          $tag = "gui-designer-$channel"
          $title = if ($channel -eq 'stable') { 'Forever GUI Designer Stable' } else { 'Forever GUI Designer Development' }
          $notes = "Automated $channel channel for the Forever GUI Designer. Build: $env:GITHUB_SHA"
          $immutableAsset = "ForeverGuiDesigner-$env:GITHUB_SHA.exe"

          gh release view $tag *> $null
          $exists = $LASTEXITCODE -eq 0
          $global:LASTEXITCODE = 0

          if (-not $exists) {
            if ($channel -eq 'development') {
              gh release create $tag --target $env:GITHUB_SHA --title $title --notes 'Initializing update channel…' --prerelease
            } else {
              gh release create $tag --target $env:GITHUB_SHA --title $title --notes 'Initializing update channel…'
            }
          }

          # Upload the immutable asset first. A client that has already resolved a
          # build can now always download that exact executable even if the channel
          # advances while the download is in progress.
          gh release upload $tag ".\artifacts\$immutableAsset#$immutableAsset" --clobber

          # Keep the legacy alias for installed pre-immutable clients. The manifest
          # itself points at the immutable asset.
          gh release upload $tag `
            '.\artifacts\ForeverGuiDesigner\ForeverGuiDesigner.exe#ForeverGuiDesigner.exe' `
            '.\artifacts\update-manifest.json#update-manifest.json' `
            --clobber

          # The release body is the channel pointer consumed by the API path. Move
          # it only after every asset for this build is present and verified by GH.
          gh release edit $tag --title $title --notes $notes
