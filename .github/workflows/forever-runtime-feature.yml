name: Forever Runtime Feature CI

on:
  push:
    branches:
      - feature/forever-studio-foundation
    paths:
      - 'mod/**'
      - '.github/workflows/forever-runtime-feature.yml'
  workflow_dispatch:

concurrency:
  group: forever-runtime-feature-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile and test mod runtime
        run: ./gradlew build compileGameTestJava --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ForeverSkyblock-Feature-Runtime
          path: mod/build/libs/*.jar
          if-no-files-found: error
          retention-days: 7
